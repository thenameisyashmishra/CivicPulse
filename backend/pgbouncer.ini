;; PgBouncer Configuration for 10M Concurrent User Concurrency Multiplexing

[databases]
civicpulse = host=postgres-primary port=5432 dbname=civicpulse pool_size=100 reserve_pool=50
civicpulse_replica = host=postgres-replica port=5432 dbname=civicpulse pool_size=100 reserve_pool=50

[pgbouncer]
;; Cloud-Native stdout logging for container aggregators
logfile = /dev/stdout
pidfile = /var/run/postgresql/pgbouncer.pid

listen_addr = *
listen_port = 6432

;; SCRAM-SHA-256 cryptographic authentication
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

;; Transaction pooling mode permits millions of app client connections 
;; to share a small, hyper-efficient pool of backend PostgreSQL connections.
pool_mode = transaction

;; Maximum client connections to PgBouncer
max_client_conn = 50000

;; Default size of backend connection pool per user/database pair
default_pool_size = 100
min_pool_size = 20
reserve_pool_size = 50
reserve_pool_timeout = 5

;; Reserved 40 backend connections for superuser / replication / admin monitoring
max_db_connections = 480
server_idle_timeout = 600
server_connect_timeout = 15
server_login_retry = 15
query_timeout = 30
client_idle_timeout = 300

stats_period = 60
admin_users = pgbouncer_admin
