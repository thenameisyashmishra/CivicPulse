# Default values for civicpulse enterprise deployment

global:
  environment: production
  domain: civicpulse.gov.in

backend:
  replicaCount: 3
  image:
    repository: civicpulse-backend
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      cpu: 250m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  env:
    APP_ENV: production
    DB_POOL_SIZE: 20
    DB_MAX_OVERFLOW: 30
    GEOFENCE_RADIUS_METERS: 500.0
    OPENTELEMETRY_ENABLED: true
    OPENTELEMETRY_ENDPOINT: "http://otel-collector:4317"

frontend:
  replicaCount: 2
  image:
    repository: civicpulse-frontend
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: false

postgresql:
  enabled: true
  auth:
    database: civicpulse
    username: postgres
  primary:
    persistence:
      enabled: true
      size: 50Gi

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
  hosts:
    - host: civicpulse.gov.in
      paths:
        - path: /
          pathType: Prefix
          service: frontend
        - path: /api
          pathType: Prefix
          service: backend
        - path: /uploads
          pathType: Prefix
          service: backend
        - path: /metrics
          pathType: Prefix
          service: backend
