apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
data:
  APP_ENV: "{{ .Values.backend.env.APP_ENV }}"
  DATABASE_URL: "postgresql://postgres:postgres@{{ .Release.Name }}-postgresql:5432/civicpulse"
  REDIS_URL: "redis://{{ .Release.Name }}-redis-master:6379/0"
  DB_POOL_SIZE: "{{ .Values.backend.env.DB_POOL_SIZE }}"
  DB_MAX_OVERFLOW: "{{ .Values.backend.env.DB_MAX_OVERFLOW }}"
  GEOFENCE_RADIUS_METERS: "{{ .Values.backend.env.GEOFENCE_RADIUS_METERS }}"
  OPENTELEMETRY_ENABLED: "{{ .Values.backend.env.OPENTELEMETRY_ENABLED }}"
  OPENTELEMETRY_ENDPOINT: "{{ .Values.backend.env.OPENTELEMETRY_ENDPOINT }}"
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
type: Opaque
stringData:
  JWT_SECRET_KEY: "change_me_to_production_high_entropy_secret_key_32_chars"
  FIELD_ENCRYPTION_KEY: "change_me_to_production_field_encryption_key_32_chars"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-pg-backup
spec:
  schedule: "0 2 * * *"  # Nightly at 02:00 UTC
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: prodrigestivill/postgres-backup-local:16
              env:
                - name: POSTGRES_HOST
                  value: "{{ .Release.Name }}-postgresql"
                - name: POSTGRES_DB
                  value: "civicpulse"
                - name: POSTGRES_USER
                  value: "postgres"
                - name: BACKUP_KEEP_DAYS
                  value: "14"
                - name: BACKUP_KEEP_WEEKS
                  value: "4"
